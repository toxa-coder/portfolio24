<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var a=0;
        function changeImage(){
            if (a==0){
                document.img.src='1.gif';
                a=1;
            }
            else{
                document.img.src='2.gif';
                a=0;
            }
        }
    </script>
    <button onClick="changeImage()">Сменить изображение</button>
    <br>
    <img name="img" src="1.gif">
</body>
</html>
